name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm install
      - run: python tools/sync_version.py
      - run: git diff --exit-code -- sw-version.js
      - run: python -m ruff check .
      - run: npm run lint
      - run: python -m compileall -q main.py app gazetteer.py risk_engine tools
      - run: python -m pytest -q
      - run: npm exec -- eslint --max-warnings 0 --ext .js .
      - run: npx playwright install --with-deps chromium
      - run: node tests/nature.test.mjs
      - run: npm exec -- playwright test
      - run: npm exec -- playwright test -c playwright.ux.config.js
